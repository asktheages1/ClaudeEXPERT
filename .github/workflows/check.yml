# Server-side run of the repository checks. A session cannot switch this off from inside its container.
# Two triggers, two trust levels:
# - push: fast feedback; the workflow file and check.sh come from the pushed branch, so a branch can tamper
#   with both. Mitigated by running the check.sh copy from origin/main and by the guard job.
# - pull_request_target: the workflow definition comes from the BASE branch (main) and cannot be edited by
#   the PR; the jobs check out the PR head explicitly and run main's check.sh on it. This is the status to
#   trust before merging. The jobs run no code from the PR, only main's check.sh over its files, with a
#   read-only token that is not persisted.
# Job names carry the event, so a push run can never satisfy a status required from the PR run.
# Residual: a red status informs; only a ruleset / branch protection on main blocks a merge (O0 §8).
name: check
on:
  push:
  pull_request_target:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  check:
    name: check (${{ github.event_name }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Run main's scripts/check.sh files on this code
        run: |
          git fetch origin main
          git show origin/main:scripts/check.sh > /tmp/check-main.sh
          bash /tmp/check-main.sh files
  guard:
    name: guard (${{ github.event_name }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Fail if .github, .claude, CLAUDE.md or scripts differ from origin/main (red = read that diff before merging)
        run: |
          git fetch origin main
          git show origin/main:scripts/check.sh > /tmp/check-main.sh
          bash /tmp/check-main.sh guard
