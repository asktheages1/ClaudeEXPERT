# Server-side run of the repository checks. A session cannot switch this off from inside its container,
# but it CAN edit scripts/check.sh and this file on its branch. Mitigations: job "check" runs the copy of
# check.sh from origin/main, not the branch's; job "guard" turns red whenever a branch changes any
# enforcement file (this workflow, settings.json, hooks, check.sh), so the owner reads that diff before
# merging. Residual hole: this workflow file itself, edited on the branch, runs as edited. The owner's
# eyes on .github/ and .claude/ in the merge diff are the last gate (O0 §8).
name: check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Run scripts/check.sh files from origin/main (falls back to the branch copy on main itself)
        run: |
          git fetch origin main
          git show origin/main:scripts/check.sh > /tmp/check-main.sh 2>/dev/null || cp scripts/check.sh /tmp/check-main.sh
          bash /tmp/check-main.sh files
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Fail if enforcement files differ from origin/main (red = read this diff before merging)
        run: |
          git fetch origin main
          git show origin/main:scripts/check.sh > /tmp/check-main.sh 2>/dev/null || cp scripts/check.sh /tmp/check-main.sh
          bash /tmp/check-main.sh guard
